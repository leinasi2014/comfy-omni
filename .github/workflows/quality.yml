name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Docker / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run quality gates in Docker
        run: ./scripts/docker.sh quality "${{ matrix.python-version }}"

      - name: Reject tracked model weights
        shell: bash
        run: |
          tracked_weights="$(git ls-files | grep -E '\.(safetensors|ckpt|pt|pth)$' || true)"
          if [[ -n "$tracked_weights" ]]; then
            printf 'Model weights must not be committed:\n%s\n' "$tracked_weights" >&2
            exit 1
          fi

  package:
    name: Docker / package and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and verify distributions in Docker
        run: ./scripts/docker.sh package 3.12
