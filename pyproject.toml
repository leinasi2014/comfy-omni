[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-omni"
version = "0.2.0a1"
description = "Bring Comfy checkpoints to native Omni runtimes."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ComfyOmni contributors" }]
keywords = ["comfyui", "checkpoint", "conversion", "omni", "vllm"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.115", "pydantic>=2"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.11",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/leinasi2014/comfy-omni"
Documentation = "https://github.com/leinasi2014/comfy-omni/tree/main/docs"
Issues = "https://github.com/leinasi2014/comfy-omni/issues"
Source = "https://github.com/leinasi2014/comfy-omni"

[project.scripts]
comfy-omni = "comfy_omni.cli:main"

[project.entry-points."vllm_omni.general_plugins"]
comfy_omni = "comfy_omni.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comfy_omni = ["py.typed", "resources/contracts/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
